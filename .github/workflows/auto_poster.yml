name: Auto Generate and Publish Article

on:
  workflow_dispatch: # Aap jab chahein GitHub par ek click karke naya article generate karwa sakte hain
  schedule:
    - cron: '0 0 * * *' # Yeh rozana ek naya article khud-ba-khud generate kar dega (optional)

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Run AI Generator Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          python -c '
          import os, requests, json, base64
          from datetime import datetime

          api_key = os.environ["GEMINI_API_KEY"]
          gh_token = os.environ["GH_TOKEN"]
          repo = "hp00101/auto-blog"

          url = f"https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key={api_key}"
          prompt = "Write an SEO-optimized HTML article about a trending tech or cloud hosting tool in 2026. Include headings (<h2>, <h3>), paragraphs (<p>), and a link mentioning Hostinger or Make.com. Return ONLY the HTML body content inside standard HTML article tags, without markdown code blocks."
          
          payload = {"contents": [{"parts": [{"text": prompt}]}]}
          response = requests.post(url, headers={"Content-Type": "application/json"}, data=json.dumps(payload))
          
          if response.status_code == 200:
              article_html = response.json()["candidates"][0]["content"]["parts"][0]["text"]
              date_str = datetime.now().strftime("%Y-%m-%d-%H%M%S")
              filename = f"posts/ai-article-{date_str}.html"
              
              full_page = f"""<!DOCTYPE html>
              <html lang="en">
              <head>
                  <meta charset="UTF-8">
                  <meta name="viewport" content="width=device-width, initial-scale=1.0">
                  <title>AI Tech Insights</title>
                  <link rel="stylesheet" href="../styles.css">
              </head>
              <body>
                  <header>
                      <div class="container">
                          <h1>Tech & AI Insights Hub</h1>
                          <p><a href="../index.html" style="color: #bdc3c7; text-decoration: none;">&larr; Back to Home</a></p>
                      </div>
                  </header>
                  <main class="container">
                      <article class="post-card">
                          {article_html}
                      </article>
                  </main>
                  <footer>
                      <p>&copy; 2026 Tech & AI Insights Hub. All rights reserved.</p>
                  </footer>
              </body>
              </html>"""

              gh_url = f"https://api.github.com/repos/{repo}/contents/{filename}"
              encoded_content = base64.b64encode(full_page.encode("utf-8")).decode("utf-8")
              data = {
                  "message": f"Automated AI article: {filename}",
                  "content": encoded_content,
                  "branch": "main"
              }
              headers = {"Authorization": f"Bearer {gh_token}", "Accept": "vnd.github+json"}
              put_res = requests.put(gh_url, headers=headers, data=json.dumps(data))
              print("Publish status:", put_res.status_code)
          else:
              print("Gemini API Error:", response.text)
          '
