<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech & AI Insights Hub — AI News, Tools & Automation</title>
    <meta name="description" content="AI news, tool roundups, and automation workflow guides — researched, written, and published automatically, every day.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div class="container">
            <span class="badge">Auto-Published Digest</span>
            <h1>Tech & AI Insights Hub</h1>
            <p>AI news, tool roundups, and automation workflow guides — researched, written, and published by a script, so the shelf never runs empty.</p>
            <span class="status-line" id="status-line"><span class="dot"></span>Loading feed…</span>
        </div>
    </header>

    <main class="container--wide">
        <nav class="filters" id="filters" aria-label="Filter posts by category"></nav>

        <div class="posts-grid" id="posts-grid">
            <div class="skeleton-card"></div>
            <div class="skeleton-card"></div>
            <div class="skeleton-card"></div>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Tech & AI Insights Hub. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
